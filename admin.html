<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — WriteMyLyrics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --black:#07060a;--surface:#0e0d12;--surface2:#151419;--surface3:#1c1b22;
  --gold:#c9943a;--gold2:#e8b84b;--gold-dim:rgba(201,148,58,.15);
  --text:#ede8df;--text2:#9b9490;--text3:#524e4a;
  --border:rgba(255,255,255,.06);--border2:rgba(255,255,255,.1);
  --green:#4caf7d;--red:#e05c5c;
}
body{background:var(--black);color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}

/* ── NAV ── */
nav{padding:0 40px;height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(7,6,10,.9);position:sticky;top:0;z-index:10}
.logo{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--text);text-decoration:none;letter-spacing:-.02em}
.logo span{color:var(--gold)}
.nav-badge{background:var(--surface3);border:1px solid var(--border2);border-radius:6px;padding:3px 10px;font-size:11px;color:var(--text3);letter-spacing:.08em;text-transform:uppercase}

/* ── PASSWORD GATE ── */
#gate{display:flex;align-items:center;justify-content:center;min-height:calc(100vh - 64px);padding:24px}
.gate-box{background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:48px 40px;width:100%;max-width:400px;text-align:center}
.gate-box h2{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:700;margin-bottom:8px}
.gate-box p{color:var(--text2);font-size:14px;margin-bottom:32px}
.gate-input{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:12px 16px;font-family:'DM Sans',sans-serif;font-size:15px;color:var(--text);outline:none;transition:border-color .2s;margin-bottom:12px}
.gate-input:focus{border-color:var(--gold)}
.gate-btn{width:100%;background:var(--gold);color:#07060a;border:none;border-radius:8px;padding:12px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:600;cursor:pointer;transition:background .2s}
.gate-btn:hover{background:var(--gold2)}
.gate-error{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}

/* ── DASHBOARD ── */
#dashboard{display:none;max-width:1100px;margin:0 auto;padding:48px 24px 80px}
.dash-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:40px;flex-wrap:gap;gap:12px}
.dash-header h1{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:700;letter-spacing:-.02em}
.dash-header h1 span{color:var(--gold)}
.refresh-btn{background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 18px;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;color:var(--text2);cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px}
.refresh-btn:hover{border-color:var(--gold);color:var(--gold)}
.refresh-btn svg{width:14px;height:14px;fill:currentColor}

/* ── SECTION LABELS ── */
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--text3);font-weight:600;margin-bottom:16px}

/* ── STAT GRID ── */
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:40px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:22px 24px}
.stat-card.gold{border-color:rgba(201,148,58,.3);background:var(--gold-dim)}
.stat-label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:8px}
.stat-value{font-family:'Cormorant Garamond',serif;font-size:40px;font-weight:700;line-height:1;color:var(--text)}
.stat-card.gold .stat-value{color:var(--gold2)}
.stat-sub{font-size:12px;color:var(--text2);margin-top:6px}

/* ── TWO-COL ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:40px}
@media(max-width:700px){.two-col{grid-template-columns:1fr}}

/* ── PANEL ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px}

/* ── PLAN BARS ── */
.plan-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.plan-row:last-child{margin-bottom:0}
.plan-name{font-size:13px;font-weight:500;width:72px;flex-shrink:0}
.plan-bar-wrap{flex:1;background:var(--surface3);border-radius:4px;height:8px;overflow:hidden}
.plan-bar{height:100%;border-radius:4px;transition:width .6s ease}
.bar-free{background:var(--text3)}
.bar-pro{background:var(--gold)}
.bar-unlimited{background:var(--gold2)}
.plan-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);width:28px;text-align:right;flex-shrink:0}

/* ── GENRE LIST ── */
.genre-row{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.genre-row:last-child{margin-bottom:0}
.genre-rank{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);width:18px;flex-shrink:0}
.genre-name{font-size:13px;flex:1}
.genre-bar-wrap{width:90px;background:var(--surface3);border-radius:4px;height:6px;overflow:hidden;flex-shrink:0}
.genre-bar{height:100%;border-radius:4px;background:var(--gold);transition:width .6s ease}
.genre-count{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);width:28px;text-align:right;flex-shrink:0}

/* ── SIGNUPS TABLE ── */
.signups-table{width:100%;border-collapse:collapse}
.signups-table th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--text3);padding:0 12px 12px;text-align:left;border-bottom:1px solid var(--border);font-weight:600}
.signups-table td{padding:12px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle}
.signups-table tr:last-child td{border-bottom:none}
.signups-table tr:hover td{background:var(--surface2)}
.plan-chip{display:inline-block;border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip-free{background:var(--surface3);color:var(--text3)}
.chip-pro{background:rgba(201,148,58,.2);color:var(--gold)}
.chip-unlimited{background:rgba(232,184,75,.25);color:var(--gold2)}
.email-cell{color:var(--text);font-family:'DM Mono',monospace;font-size:12px}
.date-cell{color:var(--text2);font-size:12px;white-space:nowrap}
.songs-cell{font-family:'DM Mono',monospace;font-size:12px;color:var(--text2);text-align:right}

/* ── LOADING / ERROR ── */
.loading-pulse{color:var(--text3);font-size:13px;text-align:center;padding:40px 0}
.dash-error{background:rgba(224,92,92,.1);border:1px solid rgba(224,92,92,.3);border-radius:8px;padding:14px 18px;font-size:13px;color:var(--red);margin-bottom:24px}

@media(max-width:600px){
  nav{padding:0 16px}
  #dashboard{padding:32px 16px 60px}
  .stat-grid{grid-template-columns:1fr 1fr}
  .dash-header h1{font-size:26px}
  .signups-table th:nth-child(3),.signups-table td:nth-child(3){display:none}
}
</style>
</head>
<body>

<nav>
  <a class="logo" href="/">Write<span>My</span>Lyrics</a>
  <span class="nav-badge">Admin</span>
</nav>

<!-- PASSWORD GATE -->
<div id="gate">
  <div class="gate-box">
    <h2>Admin <span style="color:var(--gold)">Access</span></h2>
    <p>Enter the admin password to view dashboard data.</p>
    <input class="gate-input" type="password" id="pwInput" placeholder="Password" autocomplete="current-password">
    <button class="gate-btn" onclick="checkPassword()">Unlock Dashboard</button>
    <div class="gate-error" id="gateError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <div class="dash-header">
    <h1>Dashboard <span>↗</span></h1>
    <button class="refresh-btn" onclick="loadDashboard()">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      Refresh
    </button>
  </div>

  <div id="dashError" class="dash-error" style="display:none"></div>

  <!-- REVENUE -->
  <div class="section-title">Monthly Revenue (MRR)</div>
  <div class="stat-grid" id="revenueStats">
    <div class="loading-pulse">Loading…</div>
  </div>

  <!-- USERS -->
  <div class="section-title">Users</div>
  <div class="stat-grid" id="userStats">
    <div class="loading-pulse">Loading…</div>
  </div>

  <!-- SONGS -->
  <div class="section-title">Songs Generated</div>
  <div class="stat-grid" id="songStats">
    <div class="loading-pulse">Loading…</div>
  </div>

  <!-- PLANS + GENRES -->
  <div class="two-col">
    <div class="panel">
      <div class="section-title" style="margin-bottom:20px">Plan Breakdown</div>
      <div id="planBreakdown"><div class="loading-pulse">Loading…</div></div>
    </div>
    <div class="panel">
      <div class="section-title" style="margin-bottom:20px">Top Genres</div>
      <div id="topGenres"><div class="loading-pulse">Loading…</div></div>
    </div>
  </div>

  <!-- RECENT SIGNUPS -->
  <div class="section-title">Recent Signups</div>
  <div class="panel">
    <div id="recentSignups"><div class="loading-pulse">Loading…</div></div>
  </div>

  <!-- FEEDBACK -->
  <div class="section-title">Recent Feedback</div>
  <div class="panel">
    <div id="recentFeedback"><div class="loading-pulse">Loading…</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const ADMIN_PASSWORD = 'WML2024admin';
const SUPABASE_URL   = 'https://vlxjmkojunrmpomhuxyg.supabase.co';
const SUPABASE_ANON  = 'sb_publishable_5XqQ-CLL9ggr62obfkAdwA_IWFMVLr1';

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

// ── AUTH GATE ────────────────────────────────────────────────────────────────
function checkPassword() {
  const val = document.getElementById('pwInput').value;
  if (val === ADMIN_PASSWORD) {
    sessionStorage.setItem('wml_admin', '1');
    showDashboard();
  } else {
    document.getElementById('gateError').textContent = 'Incorrect password.';
    document.getElementById('pwInput').value = '';
    document.getElementById('pwInput').focus();
  }
}

document.getElementById('pwInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') checkPassword();
  document.getElementById('gateError').textContent = '';
});

function showDashboard() {
  document.getElementById('gate').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  loadDashboard();
}

// Auto-unlock if already authenticated this session
if (sessionStorage.getItem('wml_admin') === '1') showDashboard();

// ── DATA LOADING ─────────────────────────────────────────────────────────────
async function loadDashboard() {
  clearError();

  const [statsRes, signupsRes, feedbackRes] = await Promise.all([
    sb.rpc('admin_get_stats'),
    sb.rpc('admin_get_recent_signups'),
    sb.rpc('admin_get_feedback')
  ]);

  if (statsRes.error) {
    showError('Failed to load stats: ' + statsRes.error.message + '. Make sure supabase-admin.sql has been run.');
    return;
  }
  if (signupsRes.error) {
    showError('Failed to load signups: ' + signupsRes.error.message);
    return;
  }

  const s = statsRes.data;
  const signups = signupsRes.data || [];
  const feedback = feedbackRes?.data || [];

  renderRevenueStats(s);
  renderUserStats(s);
  renderSongStats(s);
  renderPlanBreakdown(s);
  renderTopGenres(s);
  renderRecentSignups(signups);
  renderRecentFeedback(feedback);
}

// ── RENDER HELPERS ────────────────────────────────────────────────────────────
function renderRevenueStats(s) {
  document.getElementById('revenueStats').innerHTML = `
    <div class="stat-card gold">
      <div class="stat-label">Total MRR</div>
      <div class="stat-value">$${fmt(s.monthly_revenue_total)}</div>
      <div class="stat-sub">Pro + Unlimited</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-label">Pro MRR</div>
      <div class="stat-value">$${fmt(s.monthly_revenue_pro)}</div>
      <div class="stat-sub">${fmt(s.plan_pro)} users × $9</div>
    </div>
    <div class="stat-card gold">
      <div class="stat-label">Unlimited MRR</div>
      <div class="stat-value">$${fmt(s.monthly_revenue_unlimited)}</div>
      <div class="stat-sub">${fmt(s.plan_unlimited)} users × $19</div>
    </div>
  `;
}

function renderUserStats(s) {
  document.getElementById('userStats').innerHTML = `
    <div class="stat-card gold">
      <div class="stat-label">Total Users</div>
      <div class="stat-value">${fmt(s.total_users)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">New Today</div>
      <div class="stat-value">${fmt(s.signups_today)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">New This Week</div>
      <div class="stat-value">${fmt(s.signups_week)}</div>
      <div class="stat-sub">Mon – today</div>
    </div>
  `;
}

function renderSongStats(s) {
  document.getElementById('songStats').innerHTML = `
    <div class="stat-card gold">
      <div class="stat-label">Total Songs</div>
      <div class="stat-value">${fmt(s.total_songs)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Generated Today</div>
      <div class="stat-value">${fmt(s.songs_today)}</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Generated This Week</div>
      <div class="stat-value">${fmt(s.songs_week)}</div>
      <div class="stat-sub">Mon – today</div>
    </div>
  `;
}

function renderPlanBreakdown(s) {
  const total = s.total_users || 1;
  const plans = [
    { key: 'free',      label: 'Free',      cls: 'bar-free',      count: s.plan_free },
    { key: 'pro',       label: 'Pro',       cls: 'bar-pro',       count: s.plan_pro },
    { key: 'unlimited', label: 'Unlimited', cls: 'bar-unlimited', count: s.plan_unlimited },
  ];
  document.getElementById('planBreakdown').innerHTML = plans.map(p => {
    const pct = Math.round((p.count / total) * 100);
    return `
      <div class="plan-row">
        <span class="plan-name">${p.label}</span>
        <div class="plan-bar-wrap"><div class="plan-bar ${p.cls}" style="width:${pct}%"></div></div>
        <span class="plan-count">${p.count}</span>
      </div>`;
  }).join('');
}

function renderTopGenres(s) {
  const genres = s.top_genres || [];
  if (!genres.length) {
    document.getElementById('topGenres').innerHTML = '<div class="loading-pulse">No data yet</div>';
    return;
  }
  const max = genres[0].cnt || 1;
  document.getElementById('topGenres').innerHTML = genres.map((g, i) => {
    const pct = Math.round((g.cnt / max) * 100);
    return `
      <div class="genre-row">
        <span class="genre-rank">${i + 1}</span>
        <span class="genre-name">${esc(g.genre)}</span>
        <div class="genre-bar-wrap"><div class="genre-bar" style="width:${pct}%"></div></div>
        <span class="genre-count">${g.cnt}</span>
      </div>`;
  }).join('');
}

function renderRecentSignups(signups) {
  if (!signups.length) {
    document.getElementById('recentSignups').innerHTML = '<div class="loading-pulse">No signups yet</div>';
    return;
  }
  const rows = signups.map(u => `
    <tr>
      <td class="email-cell">${esc(u.email || '—')}</td>
      <td><span class="plan-chip chip-${u.plan || 'free'}">${u.plan || 'free'}</span></td>
      <td class="date-cell">${fmtDate(u.created_at)}</td>
      <td class="songs-cell">${u.usage_count ?? 0}</td>
    </tr>`).join('');
  document.getElementById('recentSignups').innerHTML = `
    <table class="signups-table">
      <thead><tr>
        <th>Email</th>
        <th>Plan</th>
        <th>Signed Up</th>
        <th style="text-align:right">Songs</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function renderRecentFeedback(items) {
  const el = document.getElementById('recentFeedback');
  if (!items || !items.length) {
    el.innerHTML = '<div class="loading-pulse">No feedback yet. Run supabase-feedback.sql to enable this feature.</div>';
    return;
  }
  const rows = items.map(f => {
    const stars = '★'.repeat(f.rating) + '☆'.repeat(5 - f.rating);
    return `
      <tr>
        <td class="email-cell">${esc(f.email || 'Anonymous')}</td>
        <td style="color:#e8b84b;letter-spacing:.05em;font-size:13px">${stars}</td>
        <td style="max-width:320px;font-size:13px;color:#9b9490">${esc(f.comment || '—')}</td>
        <td class="date-cell">${fmtDate(f.created_at)}</td>
      </tr>`;
  }).join('');
  el.innerHTML = `
    <table class="signups-table">
      <thead><tr>
        <th>User</th>
        <th>Rating</th>
        <th>Comment</th>
        <th>Date</th>
      </tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

// ── UTILS ─────────────────────────────────────────────────────────────────────
function fmt(n) { return (n ?? 0).toLocaleString(); }
function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
}
function showError(msg) {
  const el = document.getElementById('dashError');
  el.textContent = msg;
  el.style.display = 'block';
}
function clearError() {
  const el = document.getElementById('dashError');
  el.textContent = '';
  el.style.display = 'none';
}
</script>
</body>
</html>
